# Basic logging
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Activate C++
CONFIG_CPP=y
CONFIG_STD_CPP2B=y
CONFIG_GLIBCXX_LIBCPP=y

# Increase main stack size
CONFIG_MAIN_STACK_SIZE=2048

CONFIG_GPIO=y

# Enable I2C, Sensor API, and MPU6050 driver
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_MPU6050=y

# Enable float printing for sensor values
CONFIG_CBPRINTF_FP_SUPPORT=y
# CONFIG_MPU6050_TRIGGER=y