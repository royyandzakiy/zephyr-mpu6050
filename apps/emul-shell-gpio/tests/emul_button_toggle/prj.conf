# Basic logging
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Activate C++
CONFIG_CPP=y
CONFIG_STD_CPP2B=y
CONFIG_GLIBCXX_LIBCPP=y

# Increase main stack size
CONFIG_MAIN_STACK_SIZE=2048

## ------ Additional KConfigs ------- ##
CONFIG_SHELL_VT100_COLORS=n

# GPIO emulation
CONFIG_GPIO_EMUL=y
CONFIG_GPIO=y

# Shell support for test commands
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y